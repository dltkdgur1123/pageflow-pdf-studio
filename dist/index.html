<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="PDF 페이지를 고르고, 순서를 바꾸고, 하나의 파일로. 브라우저 안에서 끝내는 PageFlow."><title>PageFlow — PDF 작업 공간</title><link rel="stylesheet" href="style.7d1e0baf405ea7fa.css"></head>
<body><header><a class="brand" href="./"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 7H19a3 3 0 0 1 3 3v17H9a3 3 0 0 1-3-3V7Z" fill="currentColor" opacity=".25"/><path d="M11 4h10l6 6v14a3 3 0 0 1-3 3H11V4Z" fill="currentColor"/><path d="M21 4v6h6M15 15h8M15 19h5" stroke="#293026" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v14a3 3 0 0 0 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>PageFlow<span class="tag">PDF STUDIO</span></a></header>
<main><aside><div class="section-label">SOURCE FILES <span id="fileCount">0</span></div><h2>내 파일</h2><button id="originalWorkspace" class="file">원본 작업 공간</button><div id="files"></div><div class="section-label project-heading">NEW PROJECTS</div><div id="projects"></div><button class="drop-mini" id="add" aria-describedby="fileLimit"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 4v12M4 10h12"/></svg><span>파일 추가</span></button><p id="fileLimit" class="file-limit">파일당 최대 300MB</p></aside>
<section class="editor" data-layout="both"><div class="layout-tools" aria-label="작업 화면 보기"><button id="layoutBoth" aria-pressed="true" aria-label="함께 보기" title="함께 보기"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button><button id="layoutPreview" aria-pressed="false" aria-label="미리보기 크게" title="미리보기 크게"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5M3 3l6 6M21 3l-6 6M21 21l-6-6M3 21l6-6"/></svg></button><button id="layoutPages" aria-pressed="false" aria-label="페이지 선택 크게" title="페이지 선택 크게"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div><section class="preview-panel"><div class="viewer-toolbar"><div><span class="section-label">PREVIEW</span><strong id="previewName">문서 미리보기</strong></div><div class="toolbar-group"><button id="single" class="active" aria-pressed="true">단일</button><button id="continuous" aria-pressed="false">연속</button><span class="divider"></span><button id="zoomOut" aria-label="축소">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">＋</button><button id="fit">맞춤</button></div></div>
<div class="viewer" id="viewer"><div class="welcome" id="welcome"><div class="paper-icon" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none"><rect x="13" y="20" width="48" height="62" rx="7" fill="currentColor" opacity=".08"/><path d="M29 12h29l17 17v42a7 7 0 0 1-7 7H29a7 7 0 0 1-7-7V19a7 7 0 0 1 7-7Z" fill="#32362e" stroke="currentColor" stroke-width="2"/><path d="M58 12v13a4 4 0 0 0 4 4h13" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M33 39h27M33 46h18" stroke="currentColor" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/><text x="32" y="65" fill="currentColor" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="1">PDF</text><circle cx="74" cy="74" r="15" fill="currentColor"/><path d="M74 81V67m-5 5 5-5 5 5" stroke="#293026" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><button id="start" class="primary">＋ PDF 파일 선택</button><p class="small muted">또는 이곳에 PDF 파일을 놓으세요 · 여러 파일 지원</p></div><div id="pagesPreview"></div></div>
<div class="navigation"><button id="prev" aria-label="이전 페이지">←</button><label><input id="pageNumber" type="number" min="1" value="1" aria-label="현재 페이지"> / <span id="totalPages">0</span></label><button id="next" aria-label="다음 페이지">→</button><span class="muted small">원본 색상 유지</span></div>
</section><section class="workspace"><div class="workspace-heading"><div><span class="section-label">SELECT YOUR PAGES</span><h2>페이지 선택 <span id="pageCount">0</span></h2></div><div class="toolbar-group"><button id="undo" aria-label="실행 취소" title="실행 취소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12"/></svg></button><button id="redo" aria-label="다시 실행" title="다시 실행"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5M20 10h-10a6 6 0 0 0 0 12"/></svg></button></div></div>
<form id="searchForm" class="search-tools" role="search"><label for="searchQuery" class="sr-only">문서 검색</label><div class="search-input-wrap"><span class="search-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><input id="searchQuery" type="search" placeholder="문서에서 검색" autocomplete="off" maxlength="200"><button id="searchClear" type="button" aria-label="검색 지우기" title="검색어와 결과 지우기">×</button></div><button id="searchSubmit" type="submit" aria-label="검색" title="검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><div class="search-results-nav" id="searchResultsNav" hidden><button id="searchPrev" type="button" aria-label="이전 검색 결과">↑</button><button id="searchNext" type="button" aria-label="다음 검색 결과">↓</button></div><button id="ocrStop" type="button" hidden>중지</button><progress id="searchProgress" aria-label="전체 페이지 검색 진행률" hidden></progress><span id="ocrStatus" role="status" aria-live="polite"></span><span id="searchStatus" role="status" aria-live="polite"></span></form>
<div class="selection-tools"><label class="select-all-label"><input id="selectAll" type="checkbox">전체 선택</label><details id="rangeOptions" class="range-options"><summary><span>범위로 선택</span><svg class="range-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></summary><div class="range-popover"><label for="range">페이지 범위</label><div><input id="range" placeholder="예: 1, 3-5" aria-label="페이지 범위"><button id="applyRange" title="입력한 페이지 번호를 체크합니다">범위 선택</button></div></div></details></div>
<div id="thumbnails" class="thumbnails"><div class="empty-sequence">선택한 PDF의 페이지가 이곳에 표시됩니다.<span>드래그하거나 이동 버튼으로 순서를 바꿀 수 있어요.</span></div></div>
<div class="selection-actions" id="selectionActions" role="group" aria-label="선택한 페이지 작업" hidden><span id="selectedCount" role="status">0개 선택</span><button id="extract" aria-label="선택 페이지로 문서 만들기" title="선택한 페이지로 새 문서 만들기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 14h8M12 10v8"/></svg><span>새 문서</span></button><button id="duplicate" title="선택한 페이지 복제"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg>복제</button><button id="deleteSelected" class="danger" title="선택한 페이지 삭제 · 실행 취소 가능"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>삭제</button><button id="clearSelection" aria-label="선택 해제" title="선택 해제">×</button></div><div class="export-bar"><span class="muted small" id="sequenceHint">썸네일 체크 → 새 프로젝트 생성</span><div class="export-controls"><button id="merge" aria-label="PDF 저장" title="현재 문서 전체를 PDF로 컴퓨터에 저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span>PDF 저장</span></button></div></div></section></section></main>
<div id="status" role="status" aria-live="polite">PDF를 불러오면 시작할 수 있습니다.</div><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden><script src="vendor/pdf-lib.min.js"></script><script src="vendor/ocr/tesseract.min.js"></script><script type="module" src="app.bcbcb86057c40c4d.js"></script></body></html>
